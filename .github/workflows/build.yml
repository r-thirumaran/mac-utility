name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  MAC_APPS: clipwell vitals

jobs:
  macos:
    name: macOS DMG (${{ matrix.app }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [clipwell, vitals]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version || true
          swift --version
      - name: Build DMG
        run: make dmg-${{ matrix.app }}
      - name: Checksums
        run: cd dist-out && shasum -a 256 *.dmg | tee SHA256SUMS-${{ matrix.app }}-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-macos-dmg
          path: |
            dist-out/*.dmg
            dist-out/SHA256SUMS-*.txt
          if-no-files-found: error

  go-linux:
    name: Go + web UI tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l shared apps 2>/dev/null)" || { gofmt -l shared apps; exit 1; }
      - name: go vet (linux + windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: go test
        run: go test ./... 2>&1 | tail -60
      - name: Cross-compile Windows executables
        run: |
          mkdir -p dist-out
          for d in apps/*/win; do
            app=$(basename "$(dirname "$d")"); [ -f "$d/main.go" ] || continue
            make "exe-$app"
          done
          ls -la dist-out || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Web UI tests
        run: node tests/ui/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/*.png
          if-no-files-found: ignore

  go-windows:
    name: Go tests + exe build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet + test (native Windows)
        shell: bash
        run: |
          go vet ./...
          go test ./... 2>&1 | tail -60
      - name: Build Windows executables
        shell: bash
        run: |
          mkdir -p dist-out
          for d in apps/*/win; do
            app=$(basename "$(dirname "$d")"); [ -f "$d/main.go" ] || continue
            make "exe-$app"
          done
          ls -la dist-out || true
      - name: Checksums
        shell: bash
        run: cd dist-out && (ls *.exe >/dev/null 2>&1 && sha256sum *.exe | tee SHA256SUMS-windows.txt || echo "no executables yet")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist-out/*.exe
            dist-out/SHA256SUMS-*.txt
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, go-linux, go-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            artifacts/**/*.dmg artifacts/**/*.exe artifacts/**/*.apk artifacts/**/SHA256SUMS-*.txt 2>/dev/null \
          || gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
            artifacts/**/*.dmg artifacts/**/*.exe artifacts/**/*.apk artifacts/**/SHA256SUMS-*.txt

  shared-swift:
    name: shared/swift (macOS typecheck + tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          swift --version
      - name: Type-check every shared source the way the app build compiles it
        run: |
          set -euo pipefail
          SDK="$(xcrun --show-sdk-path --sdk macosx)"
          FILES=$(find shared/swift/Sources -name '*.swift' | sort)
          echo "$FILES"
          swiftc -typecheck -parse-as-library -swift-version 5 \
            -target arm64-apple-macos14.0 -sdk "$SDK" $FILES
      - name: swift test
        working-directory: shared/swift
        run: swift test

  shared-swift-linux:
    name: shared/swift (Linux tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: swift test
        working-directory: shared/swift
        run: |
          swift --version
          swift test
