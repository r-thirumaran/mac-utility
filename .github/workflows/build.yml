name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'releases/**'
      - 'LICENSE'
  workflow_dispatch:

# A newer push to the same branch cancels the runs still going for older commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  MAC_APPS: clipwell vitals edgehop reach

jobs:
  # Decide which macOS apps need rebuilding. macOS runner minutes cost ten times Linux
  # minutes, so a DMG is only rebuilt when that app, the shared Swift/UI code, the build
  # tools or this workflow changed (always on tags and manual runs).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      clipwell: ${{ steps.diff.outputs.clipwell }}
      vitals: ${{ steps.diff.outputs.vitals }}
      edgehop: ${{ steps.diff.outputs.edgehop }}
      reach: ${{ steps.diff.outputs.reach }}
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* || "${GITHUB_EVENT_NAME}" == workflow_dispatch || -z "${{ github.event.before }}" || "${{ github.event.before }}" == 0000000000000000000000000000000000000000 ]]; then
            files="ALL"
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" 2>/dev/null || echo ALL)
          fi
          echo "$files" | head -50
          common='^(shared/swift/|shared/ui/|shared/keymap/|Tools/|Makefile|\.github/workflows/)'
          for app in clipwell vitals edgehop reach; do
            if [[ "$files" == "ALL" ]] || echo "$files" | grep -Eq "^apps/$app/|$common"; then v=true; else v=false; fi
            echo "$app=$v" >> "$GITHUB_OUTPUT"; echo "$app: $v"
          done
          if [[ "$files" == "ALL" ]] || echo "$files" | grep -Eq '^shared/swift/|^\.github/workflows/'; then echo "swift=true" >> "$GITHUB_OUTPUT"; else echo "swift=false" >> "$GITHUB_OUTPUT"; fi

  macos:
    name: macOS DMG (${{ matrix.app }})
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [clipwell, vitals, edgehop, reach]
    steps:
      - name: Skip when nothing relevant changed
        id: gate
        shell: bash
        run: |
          case "${{ matrix.app }}" in
            clipwell) v="${{ needs.changes.outputs.clipwell }}";; vitals) v="${{ needs.changes.outputs.vitals }}";;
            edgehop) v="${{ needs.changes.outputs.edgehop }}";; reach) v="${{ needs.changes.outputs.reach }}";;
          esac
          echo "build=$v" >> "$GITHUB_OUTPUT"; echo "build ${{ matrix.app }}: $v"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.build == 'true'
      - name: Toolchain
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version || true
          swift --version
      - name: Build DMG
        if: steps.gate.outputs.build == 'true'
        run: make dmg-${{ matrix.app }}
      - name: Checksums
        if: steps.gate.outputs.build == 'true'
        run: cd dist-out && shasum -a 256 *.dmg | tee SHA256SUMS-${{ matrix.app }}-macos.txt
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.build == 'true'
        with:
          name: ${{ matrix.app }}-macos-dmg
          path: |
            dist-out/*.dmg
            dist-out/SHA256SUMS-*.txt
          if-no-files-found: error

  go-linux:
    name: Go + web UI tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l shared apps 2>/dev/null)" || { gofmt -l shared apps; exit 1; }
      - name: go vet (linux + windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: go test
        run: go test ./... 2>&1 | tail -60
      - name: Cross-compile Windows executables
        run: |
          mkdir -p dist-out
          for d in apps/*/win; do
            app=$(basename "$(dirname "$d")"); [ -f "$d/main.go" ] || continue
            make "exe-$app"
          done
          ls -la dist-out || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Web UI tests
        run: node tests/ui/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/*.png
          if-no-files-found: ignore

  go-windows:
    name: Go tests + exe build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet + test (native Windows)
        shell: bash
        run: |
          go vet ./...
          go test ./... 2>&1 | tail -60
      - name: Build Windows executables
        shell: bash
        run: |
          mkdir -p dist-out
          for d in apps/*/win; do
            app=$(basename "$(dirname "$d")"); [ -f "$d/main.go" ] || continue
            make "exe-$app"
          done
          ls -la dist-out || true
      - name: Checksums
        shell: bash
        run: cd dist-out && (ls *.exe >/dev/null 2>&1 && sha256sum *.exe | tee SHA256SUMS-windows.txt || echo "no executables yet")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist-out/*.exe
            dist-out/SHA256SUMS-*.txt
          if-no-files-found: ignore

  android:
    name: Reach Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # Capacitor 8 compiles with Java 21 (apps/reach/mobile/android/app/capacitor.build.gradle).
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            apps/reach/mobile/android/**/*.gradle*
            apps/reach/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/reach/mobile/package-lock.json
      - name: Debug keystore (optional secret, keeps every CI build installable over the previous one)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android && echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "using the ANDROID_DEBUG_KEYSTORE_B64 secret"
          else
            echo "no ANDROID_DEBUG_KEYSTORE_B64 secret: Gradle generates a fresh debug key (uninstall older builds before installing this one)"
          fi
      - name: Web bundle + Capacitor sync
        working-directory: apps/reach/mobile
        run: |
          npm ci --no-audit --no-fund
          npm run sync:www
          npx cap sync android
      - name: Gradle assembleDebug
        working-directory: apps/reach/mobile/android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Licences are already accepted on the hosted image; this only matters if AGP has to fetch platform 36.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist-out
          v=$(tr -d '[:space:]' < apps/reach/VERSION)
          cp apps/reach/mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist-out/Reach-$v-android-debug.apk"
          cd dist-out && sha256sum *.apk | tee SHA256SUMS-reach-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reach-android-apk
          path: |
            dist-out/*.apk
            dist-out/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, go-linux, go-windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            artifacts/**/*.dmg artifacts/**/*.exe artifacts/**/*.apk artifacts/**/SHA256SUMS-*.txt 2>/dev/null \
          || gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
            artifacts/**/*.dmg artifacts/**/*.exe artifacts/**/*.apk artifacts/**/SHA256SUMS-*.txt

  shared-swift:
    name: shared/swift (macOS typecheck + tests)
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.swift == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          swift --version
      - name: Type-check every shared source the way the app build compiles it
        run: |
          set -euo pipefail
          SDK="$(xcrun --show-sdk-path --sdk macosx)"
          FILES=$(find shared/swift/Sources -name '*.swift' | sort)
          echo "$FILES"
          swiftc -typecheck -parse-as-library -swift-version 5 \
            -target arm64-apple-macos14.0 -sdk "$SDK" $FILES
      - name: swift test
        working-directory: shared/swift
        run: swift test

  shared-swift-linux:
    name: shared/swift (Linux tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: swift test
        working-directory: shared/swift
        run: |
          swift --version
          swift test
